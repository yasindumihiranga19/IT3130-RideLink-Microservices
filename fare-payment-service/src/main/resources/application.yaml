server:
  port: 8084

spring:
  application:
    name: fare-payment-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  output:
    ansi:
      enabled: always
  main:
    banner-mode: off

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.ridelink: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{0}){cyan} : %msg%n"